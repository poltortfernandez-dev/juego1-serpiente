<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b18" media="(prefers-color-scheme: dark)">
  <title>Serpiente</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="layout">
    <h1>Serpiente<span>.</span></h1>
    <dl class="scores">
      <div><dt>Puntos</dt><dd id="score">00</dd></div>
      <div><dt>Récord</dt><dd id="best">00</dd></div>
    </dl>

    <div class="board">
      <canvas id="board" width="640" height="640" aria-label="Tablero de serpiente"></canvas>
      <div class="overlay" id="overlay">
        <div class="prompt">
          <h2 id="title">A jugar</h2>
          <p id="status" role="status">Come, crece y esquiva las paredes.</p>
          <button type="button" id="action" class="primary">Empezar</button>
        </div>
      </div>
    </div>

    <section class="controls" aria-labelledby="controls-title">
      <h2 id="controls-title">Controles</h2>
      <p class="keyboard">Usa las flechas o WASD para girar. Pulsa Espacio para pausar.</p>
      <p class="touch">Desliza sobre el tablero o usa las flechas.</p>
      <div class="dpad" role="group" aria-label="Dirección">
        <button type="button" data-direction="up" aria-label="Arriba">↑</button>
        <button type="button" data-direction="left" aria-label="Izquierda">←</button>
        <button type="button" data-direction="down" aria-label="Abajo">↓</button>
        <button type="button" data-direction="right" aria-label="Derecha">→</button>
      </div>
      <button type="button" id="pause" class="pause" disabled>Pausa</button>
    </section>
  </main>
</body>
</html>
